name: CI

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    checks: write
    contents: read

jobs:
    e2e-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            BASE_URL: ${{ secrets.BASE_URL }}
            USERNAME: ${{ secrets.USER_NAME }}
            PASSWORD: ${{ secrets.PASSWORD }}
            SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            # ==========================
            # Install Dependencies
            # ==========================

            - name: Install Client Dependencies
              working-directory: ./client
              run: npm i

            - name: Install Server Dependencies
              working-directory: ./server
              run: npm i

            - name: Install Test Dependencies
              working-directory: ./test
              run: npm i

            # ==========================
            # Install Playwright Browsers
            # ==========================

            - name: Install Playwright Browsers
              working-directory: ./test
              run: npx playwright install --with-deps

            # ==========================
            # Start Database / Services
            # ==========================

            - name: Start Docker Services
              working-directory: ./server
              run: docker compose up -d

            - name: Verify Server URL Exists
              run: |
                  if [ -z "$SERVER_BASE_URL" ]; then
                    echo "SERVER_BASE_URL is empty"
                    exit 1
                  fi
                  echo "SERVER_BASE_URL is configured"

            # ==========================
            # Start Backend
            # ==========================

            - name: Start Backend
              working-directory: ./server
              run: |
                  nohup npm run dev > backend.log 2>&1 &

            # ==========================
            # Start Frontend
            # ==========================

            - name: Start Frontend
              working-directory: ./client
              run: |
                  nohup npm run dev > frontend.log 2>&1 &

            # ==========================
            # Wait For Services
            # ==========================

            - name: Install wait-on
              run: npm install -g wait-on

            - name: Wait For Backend
              run: wait-on $SERVER_BASE_URL

            - name: Wait For Frontend
              run: wait-on $BASE_URL

            # ==========================
            # Run Playwright Tests
            # ==========================

            - name: Run E2E Tests
              working-directory: ./test
              run: npx playwright test

            # ==========================
            # Upload Playwright Report
            # ==========================

            - name: Upload Playwright Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: test/playwright-report/
                  retention-days: 30

            # ==========================
            # Publish JUnit Results
            # ==========================

            - name: Publish E2E Test Results
              if: always()
              uses: dorny/test-reporter@v1
              with:
                  name: E2E Test Report
                  path: test/test-results/results.xml
                  reporter: jest-junit
